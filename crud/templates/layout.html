<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>FLASK CRUD 1.6</title>
  <!-- <link rel="stylesheet" href="https://bootswatch.com/5/cosmo/bootstrap.min.css"> -->
  <link id="theme-link" rel="stylesheet" href="https://bootswatch.com/5/{{ theme }}/bootstrap.min.css">
  {% with messages = get_flashed_messages() %} {% if messages %}
  {% for message in messages %}
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>{{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
  {% endif %} {% endwith %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CRUD</a>

      <div class="d-flex align-items-center ms-auto">
        {% if session.get("user_id") %}
          <select id="themeSelector" class="form-select me-3" style="width: auto;">
            <option value="flatly" {% if theme == 'flatly' %}selected{% endif %}>Modo Claro</option>
            <option value="darkly" {% if theme == 'darkly' %}selected{% endif %}>Modo Oscuro</option>
          </select>

          <div class="nav-item text-light me-3">{{ session.get("user_id") }}</div>
          <a href="{{ url_for('logout') }}" class="btn btn-secondary">Salir</a>
        {% endif %}
      </div>
    </div>
  </nav>

</head>

<body>
  <div class="container pt-4">
    {% block body %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" 
          crossorigin="anonymous"></script>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
